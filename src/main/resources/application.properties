# 데이터베이스와 AWS 자격 증명은 환경 변수 또는 로컬 설정 파일에서 읽습니다.
db.driver=${JDBC_DRIVER}
db.url=${JDBC_URL}
db.username=${JDBC_USERNAME}
db.password=${JDBC_PASSWD}

# 키를 저장소에 적지 말고 실행 환경에서 공급합니다.
cloud.aws.credentials.access-key=${AWS_ACCESS_KEY}
cloud.aws.credentials.secret-key=${AWS_SECRET_KEY}

cloud.aws.s3.bucket=community-tycoon
cloud.aws.region.static=ap-northeast-2
